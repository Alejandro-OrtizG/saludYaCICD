name: SaludYa CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Activar Corepack (pnpm incluido)
        run: corepack enable

      - name: Instalar pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Verificar versión de pnpm
        run: pnpm -v

      - name: Permitir scripts de construcción
        run: pnpm approve-builds bcrypt core-js core-js-pure

      - name: Instalar dependencias
        run: pnpm install

      - name: Ejecutar pruebas
        run: CI=true pnpm test -- --watchAll=false

      - name: Compilar aplicación
        run: pnpm build


  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Activar Corepack (pnpm incluido)
        run: corepack enable

      - name: Instalar pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Verificar versión de pnpm
        run: pnpm -v

      - name: Instalar dependencias
        run: pnpm install

      - name: Verificar backend
        run: node --check server.js