name: SaludYa CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activar Corepack
        run: corepack enable

      - name: Activar pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Instalar dependencias
        run: pnpm install --ignore-scripts

      - name: Ejecutar Lint
        run: pnpm run lint || echo "Lint no configurado"

      - name: Ejecutar pruebas
        run: CI=true pnpm test -- --watchAll=false || echo "Sin tests"

      - name: Build frontend
        run: pnpm build

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activar Corepack
        run: corepack enable

      - name: Activar pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Instalar dependencias
        run: pnpm install --ignore-scripts

      - name: Ejecutar pruebas backend
        run: pnpm test || echo "Sin tests backend"

      - name: Verificar backend
        run: node --check server.js


  deploy:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Deploy (Frontend + Backend)
        run: echo "Aquí conectas Vercel / Render / Railway"